<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0a0a0c;
        color: #f2f2f4;
        font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        display: flex;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(#f2f2f4 1px, transparent 1px);
        background-size: 26px 26px;
        opacity: 0.06;
        -webkit-mask-image: radial-gradient(70% 70% at 30% 40%, #000, transparent);
      }

      .glow {
        position: absolute;
        width: 900px;
        height: 620px;
        right: -180px;
        top: -160px;
        background: radial-gradient(closest-side, rgba(139, 92, 246, 0.42), transparent);
      }

      .inner {
        position: relative;
        padding: 0 78px;
      }

      .marca {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 22px;
        color: #a2a2ae;
        margin-bottom: 30px;
      }

      .punto {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: #8b5cf6;
      }

      h1 {
        margin: 0;
        font-size: 82px;
        letter-spacing: -3px;
        line-height: 1;
      }

      .rol {
        margin: 16px 0 0;
        font-size: 40px;
        font-weight: 600;
        color: #b39cff;
        letter-spacing: -1px;
      }

      .stack {
        margin-top: 40px;
        display: flex;
        gap: 12px;
      }

      .stack span {
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 21px;
        color: #c8c8d2;
        border: 1px solid #33333e;
        background: #111116;
        border-radius: 999px;
        padding: 9px 20px;
      }

      .pie {
        position: absolute;
        left: 78px;
        bottom: 54px;
        font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
        font-size: 22px;
        color: #6f6f7d;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="inner">
      <div class="marca"><span class="punto"></span> NAR</div>
      <h1>Nicolás Andrade</h1>
      <p class="rol">Desarrollador Fullstack</p>
      <div class="stack">
        <span>C# / .NET</span>
        <span>TypeScript</span>
        <span>Vue</span>
        <span>Angular</span>
        <span>PostgreSQL</span>
      </div>
    </div>
    <div class="pie">nicolasandraderetamal.github.io</div>
  </body>
</html>
